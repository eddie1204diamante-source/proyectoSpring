<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividades - MindWell</title>
  <link rel="stylesheet" href="/css/actividades.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <!-- Sidebar -->
   

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🧠</div>
      <h1 class="sidebar-title">MINDWELL</h1>
    </div>
    <div class="toggle-btn" onclick="toggleSidebar()">▶</div>
    <ul>
      <li data-icon="🏠">
        <a href="/estudiante/dashboard">
          <span>Inicio</span>
        </a>
      </li>
        <li data-icon="📅" class="">
        <a href="/gestionCita">
          <span>Gestiona tus citas</span>
        </a>
      </li>
      <li data-icon="🎓" class="">
        <a href="/actividades">
          <span>Talleres</span>
        </a>
      </li>
      <li data-icon="📈">
        <a href="*">
          <span>Resultados</span>
        </a>
      </li>
    </ul>
  </div>
  <!-- header -->
   
  <header class="header">
       <div class="header-title">Actividades y Ejercicios</div>
    <div class="user-info">

  
     
      <div class="user-avatar">U</div>
   <button class="btn-sesion" id="btn-sesion">Cerrar sesión</button>
    </div>
  </header>
  <main class="main-content">
  <div id="filtros" class="filtro-box">
  <input type="text" id="filtroTexto" placeholder="Buscar actividades...">

  <select id="filtroEstado">
    <option value="">Todos</option>
    <option value="Pendiente">Pendiente</option>
    <option value="Completada">Completada</option>
  </select>

  
</div>


  <div class="split-container">

      <!-- COLUMNA IZQUIERDA - ASIGNADAS POR ORIENTADOR -->
      <div class="column">
          <h2 class="column-title">Actividades Asignadas</h2>

          <!-- CONTENEDOR QUE ESPERA EL JS -->
          <div id="contenedorAsignadas" class="lista-actividades"></div>
      </div>

      <!-- COLUMNA DERECHA - ACTIVIDADES INDEPENDIENTES -->
      <div class="column">
          <h2 class="column-title">Actividades Opcionales</h2>
          <div id="contenedorOpcionales" class="lista-actividades"></div>
      </div>

  </div>
</main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; Team Scrum 2 - SENA</p>
  </footer>
  <!--  MODAL GENERAL PARA VER ACTIVIDADES -->
  <div class="modal" id="modalInfo">
    <div class="modal-content">
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-text" id="modalText"></p>
      <button class="btn-close" onclick="closeModal()">Cerrar</button>
   

    </div>
  </div>
  
  <!--  MODAL DE CONFIRMACIÓN -->
  <div class="modal" id="modalConfirm">
    <div class="modal-content">
      <h2 class="modal-title" id="confirmTitle"></h2>
      <p class="modal-text" id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn-close" onclick="closeConfirmModal()">Cancelar</button>
        <button class="btn-confirm" onclick="confirmAction()">Confirmar</button>
      </div>
    </div>
  </div>

  </div>
</div>
<div class="modal" id="modalAsignadaInfo">
  <div class="modal-content">
    <h2 id="asignadaTitle"></h2>
    <p id="asignadaDesc"></p>

    <a id="asignadaUrl" href="#" target="_blank" style="display:none; color:blue;">
      🔗 Ver recurso
    </a>

    <p><b>Estado:</b> <span id="asignadaEstado"></span></p>

    <button class="btn-close" onclick="closeAsignadaModal()">Cerrar</button>
  </div>
</div>


<!-- 
     MODAL CONFIRMAR COMPLETADA
 -->
<div class="modal" id="modalConfirmAsignada">
  <div class="modal-content">
    <h2>Confirmar acción</h2>
    <p id="confirmAsignadaText"></p>

    <div class="modal-actions">
      <button class="btn-close" onclick="closeConfirmAsignada()">Cancelar</button>
      <button class="btn-confirm" id="btnConfirmAsignada">Confirmar</button>
    </div>
  </div>
</div>

  <!-- SCRIPT -->

<script src="/js/actividad.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/logout.js"></script>

</body>
</html>
