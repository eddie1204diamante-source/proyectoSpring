<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Orientador - MindWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/dashboardO.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
         <img src="/img/ogo.png" alt="Logo MindWell" class="logo-img" />
      <h1 class="sidebar-title">MINDWELL</h1>
    </div>
    <div class="toggle-btn" onclick="toggleSidebar()">▶</div>
    <ul>
      <li data-icon="🏠" class="active">
        <a href="/orientador/dashboard">
          <span>Inicio</span>
        </a>
      </li>
      <li data-icon="📅">
        <a href="/orientador/gestionarCita">
          <span>Gestiona tus citas</span>
        </a>
      </li>
      <li data-icon="🎓">
        <a href="/orientador/actividades">
          <span>Talleres</span>
        </a>
      </li>
      <li data-icon="📈">
        <a href="/orientador/resultados">
          <span>Resultados</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-title">Dashboard Orientador</div>
    <div class="user-info">
      <div class="user-avatar">Orientador</div>
      <button class="btn-sesion" id="btn-sesion">Cerrar sesión</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Estadísticas Rápidas -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-icon">👥</span>
        <div class="stat-value" id="stat-usuarios">0</div>
        <div class="stat-label">Usuarios Totales</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🎓</span>
        <div class="stat-value" id="stat-aprendices">0</div>
        <div class="stat-label">Aprendices</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🧘‍♀️</span>
        <div class="stat-value" id="stat-orientadores">0</div>
        <div class="stat-label">Orientadores</div>
      </div>
    </div>

    <!-- Botones de Acción Rápida -->
    <div class="quick-actions">
      <a href="/orientador/gestionarCita" class="action-btn">
        📅 <span>Nueva Cita</span>
      </a>
      <a href="/orientador/resultados" class="action-btn">
        🔍 <span>Ver Diagnóstico</span>
      </a>
      <a href="/orientador/actividades" class="action-btn">
        🎓 <span>Talleres</span>
      </a>
      <a href="/orientador/bienestar" class="action-btn">
        🧘‍♀️ <span>Ejercicios</span>
      </a>
    </div>

    <!-- Poema del Día -->
    <div id="poema-container"></div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Team Scrum 2 - SENA</p>
  </footer>

  <!-- Botón de Tema -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
    <span id="theme-icon">🌙</span>
  </button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/logout.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
