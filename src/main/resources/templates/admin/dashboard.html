<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - MindWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/dashboardAdmin.css">



<body>

<!-- 
     SIDEBAR
 -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo"> <img src="/img/logo.png" alt="Logo MindWell" class="logo-img" /></div>
        <span class="sidebar-title">MindWell Admin</span>
    </div>

    <div class="toggle-btn" onclick="toggleSidebar()">⮜</div>

    <ul>
        <li th:class="${activePage == 'home'} ? 'active'" data-icon="🏠">
            <a th:href="@{/dashboard}"><span>Inicio</span></a>
        </li>

        <li th:class="${activePage == 'usuarios'} ? 'active'" data-icon="👤">
            <a th:href="@{/admin/usuarios}"><span>Gestión de Usuarios</span></a>
        </li>

        <li th:class="${activePage == 'reportes'} ? 'active'" data-icon="📊">
            <a th:href="@{/admin/reportes}"><span>Reportes</span></a>
        </li>

        <li data-icon="🚪">
            <a href="/logout"><span>Cerrar Sesión</span></a>
        </li>
    </ul>
</aside>

<!-- 
     HEADER
 -->
<header class="header">
    <h1 class="header-title">Dashboard General</h1>

    <div class="user-info">
        <div class="user-avatar">A</div>
        <button class="btn-sesion" onclick="location.href='/logout'">Salir</button>
    </div>
</header>

<!-- 
     MAIN CONTENT
 -->
<main class="main-content">

    <h2 style="margin-bottom: 1rem;">Estadísticas Generales</h2>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-value" th:text="${totalUsuarios}">0</div>
            <div class="stat-label">Usuarios totales</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">📇</div>
            <div class="stat-value" th:text="${totalPersonas}">0</div>
            <div class="stat-label">Personas registradas</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">🎓</div>
            <div class="stat-value" th:text="${totalAprendices}">0</div>
            <div class="stat-label">Aprendices</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">💚</div>
            <div class="stat-value" th:text="${totalBienestar}">0</div>
            <div class="stat-label">Registros Bienestar</div>
        </div>
    </div>

    <div class="chart-container">
        <h3 class="chart-title">Niveles de Estrés</h3>
        <canvas id="estresChart"></canvas>
    </div>

</main>

<footer>
    © 2025 MindWell — Gaes 2
</footer>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    sidebar.classList.toggle("closed");
}

const ctx = document.getElementById('estresChart').getContext('2d');


</script>

</body>
</html>
