<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindWell | Administración de Usuarios</title>

  <link rel="stylesheet" href="/css/dashboardAdmin.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
           <img src="/img/ogo.png" alt="Logo MindWell" class="logo-img" />
      <h1 class="sidebar-title">MINDWELL</h1>
    </div>
    <ul><li data-icon="👥" class="active"><a href="#"><span>Administrar Usuarios</span></a></li></ul>
</div>

<!-- HEADER -->
<header class="header">
  <div class="header-title">Administración de Usuarios</div>
  <div class="user-info">
      <div class="user-avatar">A</div>
   <button class="btn-sesion" id="btn-sesion">Cerrar sesión</button>
  </div>
</header>

<!--  CONTENIDO  -->
<main class="main-content">
  <div class="content-box">
      <h2 style="margin-bottom:10px;color:var(--primary-color)">🔐 Control de Usuarios del Sistema</h2>

      <table id="tablaUsuarios">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Persona</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
  </div>
</main>

<!--  MODAL FORMULARIO  -->
<div class="form-popup" id="formUsuario">
  <h3 id="tituloForm"></h3>
  <input type="hidden" id="idUsuario">

  <label>Correo:</label>
  <input type="email" id="correo" required placeholder="ejemplo@email.com">

  
  <label>Rol:</label>
  <select id="rolId">
    <option value="">Seleccione un rol</option>
    <option value="1">Admin</option>
    <option value="2">Aprendiz</option>
    <option value="3">Orientador</option>
  </select>

  <label>ID Persona:</label>
  <input type="number" id="personaId" placeholder="Ej: 12">

  <button class="btn btn-create" onclick="guardarUsuario()">Guardar</button>
  <button class="btn btn-delete" onclick="cerrarForm()">Cancelar</button>
</div>

<script>
</script>


<script src="/js/logout.js"></script>
<script src="/js/admin.js"></script>

  <!-- Footer -->
  <footer>
    <p>&copy; Team scrum 2 Sena.</p>
  </footer>

</body>
</html>
